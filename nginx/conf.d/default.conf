# Reverse proxy for the Cloudflare tunnel / origin. Each domain has an HTTP
# server that only serves the Certbot ACME challenge and redirects everything
# else to HTTPS, plus an HTTPS server that terminates TLS with the
# Let's Encrypt certificate for that domain.

server {
    listen 80;
    server_name api.shylock-trial.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.shylock-trial.xyz;

    ssl_certificate /etc/letsencrypt/live/api.shylock-trial.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.shylock-trial.xyz/privkey.pem;

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name auth.shylock-trial.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name auth.shylock-trial.xyz;

    ssl_certificate /etc/letsencrypt/live/auth.shylock-trial.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.shylock-trial.xyz/privkey.pem;

    location / {
        proxy_pass http://auth:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name shylock-trial.xyz www.shylock-trial.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name shylock-trial.xyz www.shylock-trial.xyz;

    ssl_certificate /etc/letsencrypt/live/shylock-trial.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shylock-trial.xyz/privkey.pem;

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
