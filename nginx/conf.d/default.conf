# Reverse proxy for the Cloudflare tunnel / origin. Cloudflare terminates
# public TLS at its edge and always forwards to the tunnel over plain HTTP,
# so the port-80 servers below trust X-Forwarded-Proto (set by Cloudflare)
# to tell real HTTP apart from an already-HTTPS request, instead of
# redirecting every tunnel request into a loop. Each domain still gets a
# real HTTPS server on 443 with its own Let's Encrypt certificate.

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name api.shylock-trial.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        if ($forwarded_proto != "https") {
            return 301 https://$host$request_uri;
        }
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}

server {
    listen 443 ssl;
    server_name api.shylock-trial.xyz;

    ssl_certificate /etc/letsencrypt/live/api.shylock-trial.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.shylock-trial.xyz/privkey.pem;

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name auth.shylock-trial.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        if ($forwarded_proto != "https") {
            return 301 https://$host$request_uri;
        }
        proxy_pass http://auth:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}

server {
    listen 443 ssl;
    server_name auth.shylock-trial.xyz;

    ssl_certificate /etc/letsencrypt/live/auth.shylock-trial.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.shylock-trial.xyz/privkey.pem;

    location / {
        proxy_pass http://auth:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name shylock-trial.xyz www.shylock-trial.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        if ($forwarded_proto != "https") {
            return 301 https://$host$request_uri;
        }
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}

server {
    listen 443 ssl;
    server_name shylock-trial.xyz www.shylock-trial.xyz;

    ssl_certificate /etc/letsencrypt/live/shylock-trial.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shylock-trial.xyz/privkey.pem;

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
