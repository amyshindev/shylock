services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env.backend
    depends_on:
      redis:
        condition: service_started
    networks: [dreamscape]
    restart: unless-stopped

  auth:
    build:
      context: .
      dockerfile: backend/Dockerfile
    entrypoint:
      [
        "uvicorn",
        "auth_main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "9000",
      ]
    env_file:
      - .env.auth
    depends_on:
      redis:
        condition: service_started
    networks: [dreamscape]
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Browser calls the public hostnames (no host port publish; Cloudflare only).
        NEXT_PUBLIC_API_BASE_URL: https://api.shylock-trial.xyz
        NEXT_PUBLIC_AUTH_BASE_URL: https://auth.shylock-trial.xyz
    depends_on:
      - backend
      - auth
    networks: [dreamscape]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks: [dreamscape]
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # Reload every 6h so certs renewed by certbot get picked up without a restart.
    command: '/bin/sh -c ''while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'''
    depends_on:
      - backend
      - auth
      - frontend
    networks: [dreamscape]
    restart: unless-stopped

  certbot:
    image: certbot/dns-cloudflare
    container_name: certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      # API token, DNS:Edit scope for the shylock-trial.xyz zone. Not in git —
      # create manually on each host: `dns_cloudflare_api_token = <token>`.
      - ./certbot/cloudflare.ini:/etc/letsencrypt/cloudflare.ini:ro
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks: [dreamscape]
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run --token ${TUNNEL_TOKEN}
    env_file:
      - .env
    depends_on:
      - nginx
    networks: [dreamscape]
    restart: unless-stopped

networks:
  dreamscape:

volumes:
  postgres_data:
  redis_data:
